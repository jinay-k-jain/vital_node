version: "3.9"

# ── VitalNode Docker Compose ───────────────────────────────────────────────
# Starts: PostgreSQL + VitalNode Backend
# Usage:  docker-compose up --build
# ──────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vitalnode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalnode_user
      POSTGRES_PASSWORD: vitalnode_dev_password
      POSTGRES_DB: vitalnode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalnode_user -d vitalnode_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── VitalNode Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitalnode-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://vitalnode_user:vitalnode_dev_password@postgres:5432/vitalnode_db
      DATABASE_SYNC_URL: postgresql://vitalnode_user:vitalnode_dev_password@postgres:5432/vitalnode_db

      # Security — CHANGE THIS in production
      JWT_SECRET_KEY: dev_secret_key_change_before_production

      # Application
      APP_ENV: development
      LOG_LEVEL: INFO
      DEMO_MODE: "true"

      # CORS — matches default Vite dev server
      FRONTEND_URL: http://localhost:5173

      # ML and speech (mock for development)
      ML_ENGINE: mock
      SPEECH_PROVIDER: mock
      SPEECH_API_KEY: ""
      MODEL_PATH: ""
    ports:
      - "8000:8000"
    volumes:
      # Mount code for hot-reload in development
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    driver: local
